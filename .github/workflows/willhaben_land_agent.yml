name: willhaben Grundstück checker

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-land:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r standalone_willhaben_agent/requirements.txt

      - name: Validate config
        env:
          WILLHABEN_AGENT_CONFIG_JSON: ${{ secrets.WILLHABEN_AGENT_CONFIG_JSON }}
        run: |
          if [ ! -f standalone_willhaben_agent/config.json ]; then
            if [ -n "$WILLHABEN_AGENT_CONFIG_JSON" ]; then
              printf '%s' "$WILLHABEN_AGENT_CONFIG_JSON" > standalone_willhaben_agent/config.json
            elif [ -f standalone_willhaben_agent/config.example.json ]; then
              cp standalone_willhaben_agent/config.example.json standalone_willhaben_agent/config.json
              echo "Using standalone_willhaben_agent/config.example.json as fallback config."
            else
              echo "Missing standalone_willhaben_agent/config.json"
              echo "Provide it in repo, as standalone_willhaben_agent/config.example.json, or as secret WILLHABEN_AGENT_CONFIG_JSON."
              exit 1
            fi
          fi

      - name: Run checker
        run: |
          python standalone_willhaben_agent/willhaben_land_agent.py --config standalone_willhaben_agent/config.json

      - name: Remove config file
        if: always()
        run: rm -f standalone_willhaben_agent/config.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: suitable-proposals-report
          path: |
            standalone_willhaben_agent/data/suitable_proposals.md
            standalone_willhaben_agent/data/proposals.db
          if-no-files-found: warn
