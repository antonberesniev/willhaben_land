name: willhaben Grundstück checker

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-land:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore state cache
        id: restore_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            standalone_willhaben_agent/data/proposals.db
          key: willhaben-land-state-${{ github.run_id }}
          restore-keys: |
            willhaben-land-state-

      - name: Install dependencies
        run: |
          pip install -r standalone_willhaben_agent/requirements.txt

      - name: Validate config
        env:
          WILLHABEN_AGENT_CONFIG_JSON: ${{ secrets.WILLHABEN_AGENT_CONFIG_JSON }}
        run: |
          if [ ! -f standalone_willhaben_agent/config.json ]; then
            if [ -n "$WILLHABEN_AGENT_CONFIG_JSON" ]; then
              printf '%s' "$WILLHABEN_AGENT_CONFIG_JSON" > standalone_willhaben_agent/config.json
            elif [ -f standalone_willhaben_agent/config.example.json ]; then
              cp standalone_willhaben_agent/config.example.json standalone_willhaben_agent/config.json
              echo "Using standalone_willhaben_agent/config.example.json as fallback config."
            else
              echo "Missing standalone_willhaben_agent/config.json"
              echo "Provide it in repo, as standalone_willhaben_agent/config.example.json, or as secret WILLHABEN_AGENT_CONFIG_JSON."
              exit 1
            fi
          fi

      - name: Run checker
        run: |
          python standalone_willhaben_agent/willhaben_land_agent.py --config standalone_willhaben_agent/config.json

      - name: Remove config file
        if: always()
        run: rm -f standalone_willhaben_agent/config.json

      - name: Generate cache status page
        if: always()
        env:
          CACHE_HIT: ${{ steps.restore_cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_KEY: willhaben-land-state-${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p standalone_willhaben_agent/data
          DB_PATH="standalone_willhaben_agent/data/proposals.db"

          if [ -f "$DB_PATH" ]; then
            DB_EXISTS="yes"
            DB_SIZE_BYTES="$(wc -c < "$DB_PATH")"
          else
            DB_EXISTS="no"
            DB_SIZE_BYTES="0"
          fi

          GENERATED_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > standalone_willhaben_agent/data/cache_status.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Willhaben Cache Status</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; margin: 0; background: #f6f8fa; color: #1f2328; }
              .wrap { max-width: 980px; margin: 24px auto; padding: 0 16px; }
              .card { background: #fff; border: 1px solid #d0d7de; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
              h1, h2 { margin-top: 0; }
              table { width: 100%; border-collapse: collapse; }
              th, td { text-align: left; padding: 10px; border-bottom: 1px solid #d8dee4; }
              th { width: 240px; color: #57606a; font-weight: 600; }
              .ok { color: #1a7f37; font-weight: 700; }
              .warn { color: #9a6700; font-weight: 700; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="card">
                <h1>Willhaben Cache Status</h1>
                <p>Generated UTC: <strong>$GENERATED_UTC</strong></p>
                <p>Run: <a href="$RUN_URL">#$RUN_NUMBER</a> (ID: $RUN_ID)</p>
              </div>

              <div class="card">
                <h2>Cache Restore</h2>
                <table>
                  <tr><th>Repository</th><td>$REPO</td></tr>
                  <tr><th>Branch</th><td>$BRANCH</td></tr>
                  <tr><th>Primary key</th><td>$CACHE_PRIMARY_KEY</td></tr>
                  <tr><th>Matched key</th><td>${CACHE_MATCHED_KEY:-none}</td></tr>
                  <tr><th>Cache hit</th><td>$( [ "$CACHE_HIT" = "true" ] && echo '<span class="ok">true</span>' || echo '<span class="warn">false</span>' )</td></tr>
                </table>
              </div>

              <div class="card">
                <h2>Database File</h2>
                <table>
                  <tr><th>Path</th><td>$DB_PATH</td></tr>
                  <tr><th>Exists after run</th><td>$DB_EXISTS</td></tr>
                  <tr><th>File size (bytes)</th><td>$DB_SIZE_BYTES</td></tr>
                </table>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: suitable-proposals-report
          path: |
            standalone_willhaben_agent/data/suitable_proposals.md
            standalone_willhaben_agent/data/suitable_proposals.html
            standalone_willhaben_agent/data/cache_status.html
            standalone_willhaben_agent/data/proposals.db
          if-no-files-found: warn

      - name: Prepare Pages artifact
        if: always()
        run: |
          mkdir -p standalone_willhaben_agent/data/site
          cp standalone_willhaben_agent/data/suitable_proposals.html standalone_willhaben_agent/data/site/index.html
          cp standalone_willhaben_agent/data/cache_status.html standalone_willhaben_agent/data/site/cache_status.html

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: standalone_willhaben_agent/data/site

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            standalone_willhaben_agent/data/proposals.db
          key: willhaben-land-state-${{ github.run_id }}

  deploy-pages:
    if: always()
    needs: check-land
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
